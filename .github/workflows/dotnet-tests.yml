
name: RaceDay .NET CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Validate, build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate repository structure
        shell: bash
        run: |
          set -e

          test -f RaceDay.Api/RaceDay.Api.csproj || {
            echo "::error::Missing RaceDay.Api/RaceDay.Api.csproj"
            exit 1
          }

          test -f RaceDay.Api.Tests/RaceDay.Api.Tests.csproj || {
            echo "::error::Missing RaceDay.Api.Tests/RaceDay.Api.Tests.csproj"
            exit 1
          }

          echo "Repository structure validated."

      - name: Restore API dependencies
        run: dotnet restore RaceDay.Api/RaceDay.Api.csproj

      - name: Restore test dependencies
        run: dotnet restore RaceDay.Api.Tests/RaceDay.Api.Tests.csproj

      - name: Build API
        run: dotnet build RaceDay.Api/RaceDay.Api.csproj --configuration Release --no-restore

      - name: Build test project
        run: dotnet build RaceDay.Api.Tests/RaceDay.Api.Tests.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test RaceDay.Api.Tests/RaceDay.Api.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"
