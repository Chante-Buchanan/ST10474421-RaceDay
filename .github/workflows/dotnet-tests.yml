
name: RaceDay .NET CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Validate, build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate repository structure
        shell: bash
        run: |
          set -e

          test -f RaceDay/RaceDay.API/RaceDay.API.csproj || {
            echo "::error::Missing RaceDay/RaceDay.API/RaceDay.API.csproj"
            exit 1
          }

          test -f RaceDay/RaceDay.API.tests/RaceDay.API.tests.csproj || {
            echo "::error::Missing RaceDay/RaceDay.API.tests/RaceDay.API.tests.csproj"
            exit 1
          }

          echo "Repository structure validated."

      - name: Restore dependencies
        run: dotnet restore RaceDay/RaceDay.API.tests/RaceDay.API.tests.csproj

      - name: Build API
        run: dotnet build RaceDay/RaceDay.API/RaceDay.API.csproj --configuration Release

      - name: Build test project
        run: dotnet build RaceDay/RaceDay.API.tests/RaceDay.API.tests.csproj --configuration Release

      - name: Run unit tests
        run: dotnet test RaceDay/RaceDay.API.tests/RaceDay.API.tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"
